services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: portfolio-api
    ports:
      - "8000:8000"
    volumes:
      # Persiste o banco de dados do SQLite para não perder as configurações
      - ./api/portfolio.db:/app/api/portfolio.db
      - ./api/.env:/app/api/.env
      # Monta as imagens para o backend conseguir fazer o upload para a pasta correta
      - ./web/public/images:/app/web/public/images
      - ./api/gcp-key.json:/app/api/gcp-key.json:ro
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_APPLICATION_CREDENTIALS=/app/api/gcp-key.json

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: portfolio-web
    ports:
      - "3000:3000"
    volumes:
      # O frontend só lê imagens (que o backend pode adicionar) e as env locais
      - ./web/public/images:/app/public/images
      - ./web/.env.local:/app/.env.local
    depends_on:
      - api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - API_URL=http://api:8000
