version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: portfolio-api
    ports:
      - "8000:8000"
    volumes:
      # Monta o profile.json para que edições via painel Admin persistam no host
      - ./profile.json:/app/profile.json
      # Monta o .env para leitura das credenciais (Opcional se já estiverem no profile, mas seguro manter)
      - ./api/.env:/app/api/.env
      # Monta as imagens para o backend conseguir fazer o upload para a pasta correta
      - ./web/public/images:/app/web/public/images
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: portfolio-web
    ports:
      - "3000:3000"
    volumes:
      # O frontend só lê imagens (que o backend pode adicionar) e as env locais
      - ./web/public/images:/app/public/images
      - ./web/.env.local:/app/.env.local
      - ./profile.json:/profile.json
    depends_on:
      - api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
