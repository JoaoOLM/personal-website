<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Admin - Terminal Pessoal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            earth: { bg: '#292524', dark: '#1c1917', border: '#57534e' },
            forest: { primary: '#22c55e', dark: '#16a34a' },
            amber: { accent: '#F59E0B' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-earth-bg text-gray-200 h-screen overflow-hidden flex flex-col font-sans">
  <!-- Toasts Container -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>
  
  <header class="bg-earth-dark p-4 border-b border-earth-border flex justify-between items-center z-10">
    <h1 class="text-xl font-mono text-forest-primary font-bold">~/admin/dashboard</h1>
    <div id="auth-section">
      <div id="g_id_onload" data-client_id="{{GOOGLE_CLIENT_ID}}" data-callback="handleGoogleLogin"></div>
      <div class="g_id_signin" data-type="standard"></div>
    </div>
  </header>

  <div id="app-content" class="flex-1 flex overflow-hidden hidden">
    <!-- Left Panel: Forms -->
    <div class="w-1/2 flex flex-col border-r border-earth-border bg-earth-dark/50">
       <div class="flex border-b border-earth-border bg-earth-dark overflow-x-auto">
         <button class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-forest-primary text-forest-primary whitespace-nowrap" onclick="showTab('perfil', this)">Perfil</button>
         <button class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-200 whitespace-nowrap" onclick="showTab('hobbies', this)">Universo</button>
         <button class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-200 whitespace-nowrap" onclick="showTab('socials', this)">Redes</button>
         <button class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-200 whitespace-nowrap" onclick="showTab('arquivos', this)">Mídia</button>
       </div>
       <div class="flex-1 overflow-y-auto p-6" id="form-container">
          <!-- Perfil Tab -->
          <div id="tab-perfil" class="tab-content space-y-4">
             <div>
               <label class="block text-sm text-forest-primary mb-1">Nome</label>
               <input id="f-name" class="w-full bg-earth-bg border border-earth-border p-2 rounded focus:ring-1 focus:ring-forest-primary outline-none">
             </div>
             <div>
               <label class="block text-sm text-forest-primary mb-1">Role</label>
               <input id="f-role" class="w-full bg-earth-bg border border-earth-border p-2 rounded outline-none">
             </div>
             <div>
               <label class="block text-sm text-forest-primary mb-1">Status</label>
               <input id="f-status" class="w-full bg-earth-bg border border-earth-border p-2 rounded outline-none">
             </div>
             <div>
               <label class="block text-sm text-forest-primary mb-1">Bio Principal</label>
               <textarea id="f-bio" rows="4" class="w-full bg-earth-bg border border-earth-border p-2 rounded outline-none"></textarea>
             </div>
             <div>
               <label class="block text-sm text-forest-primary mb-1">Reflexão (Quote)</label>
               <textarea id="f-quote" rows="2" class="w-full bg-earth-bg border border-earth-border p-2 rounded outline-none"></textarea>
               <input id="f-quote-author" placeholder="Autor" class="w-full bg-earth-bg border border-earth-border p-2 rounded outline-none mt-2">
             </div>
             <button onclick="saveProfile()" class="w-full bg-forest-primary text-earth-dark font-bold py-2 rounded hover:bg-forest-dark transition">Salvar Alterações</button>
          </div>
          
          <!-- Universo / Hobbies Tab -->
          <div id="tab-hobbies" class="tab-content hidden space-y-6">
             <h2 class="text-lg text-amber-accent font-bold">Universo Pessoal (Páginas)</h2>
             <div id="hobbies-wrapper" class="space-y-4"></div>
             <button onclick="addHobby()" class="text-forest-primary border border-forest-primary px-4 py-2 rounded hover:bg-forest-primary hover:text-earth-dark text-sm">+ Novo Hobby</button>
             <button onclick="saveProfile()" class="w-full bg-forest-primary text-earth-dark font-bold py-2 rounded mt-6">Salvar Alterações</button>
          </div>

          <!-- Socials Tab -->
          <div id="tab-socials" class="tab-content hidden space-y-4">
             <h2 class="text-lg text-amber-accent font-bold">Redes Sociais</h2>
             <div><label class="block text-sm text-forest-primary mb-1">GitHub</label><input id="s-github" class="w-full bg-earth-bg border border-earth-border p-2 rounded outline-none"></div>
             <div><label class="block text-sm text-forest-primary mb-1">LinkedIn</label><input id="s-linkedin" class="w-full bg-earth-bg border border-earth-border p-2 rounded outline-none"></div>
             <div><label class="block text-sm text-forest-primary mb-1">Email</label><input id="s-email" class="w-full bg-earth-bg border border-earth-border p-2 rounded outline-none"></div>
             <div><label class="block text-sm text-forest-primary mb-1">GPG / PGP Key</label><input id="s-pgp" class="w-full bg-earth-bg border border-earth-border p-2 rounded outline-none"></div>
             <button onclick="saveProfile()" class="w-full bg-forest-primary text-earth-dark font-bold py-2 rounded hover:bg-forest-dark transition">Salvar Redes</button>
          </div>

          <!-- Arquivos -->
          <div id="tab-arquivos" class="tab-content hidden space-y-6">
             <div>
               <h2 class="text-lg text-amber-accent font-bold mb-2">Upload de Currículo (S3)</h2>
               <div onclick="document.getElementById('cvInput').click()" class="border-2 border-dashed border-earth-border p-6 text-center cursor-pointer hover:border-forest-primary rounded bg-earth-bg/50">
                 <p>📄 Selecione o PDF do Currículo</p>
               </div>
               <input type="file" id="cvInput" accept="application/pdf" class="hidden" onchange="uploadCV(this.files[0])">
             </div>
             <div>
               <h2 class="text-lg text-amber-accent font-bold mb-2">Imagens</h2>
               <div onclick="document.getElementById('fileInput').click()" class="border-2 border-dashed border-earth-border p-6 text-center cursor-pointer hover:border-forest-primary rounded bg-earth-bg/50 mb-4">
                 <p>📁 Enviar Imagens</p>
               </div>
               <input type="file" id="fileInput" accept="image/*" multiple class="hidden" onchange="uploadFiles(this.files)">
               <div id="img-grid" class="grid grid-cols-3 gap-2"></div>
             </div>
          </div>
       </div>
    </div>
    
    <!-- Right Panel: Preview -->
    <div class="w-1/2 flex flex-col relative">
       <div class="absolute top-0 right-0 bg-earth-dark/80 backdrop-blur text-xs px-3 py-1 text-forest-primary border-b border-l border-earth-border rounded-bl z-20 shadow">Live Preview</div>
       <iframe id="preview-frame" src="{{FRONTEND_URL}}" class="w-full h-full border-none bg-earth-bg"></iframe>
    </div>
  </div>

<script>
const API = window.location.origin;
let profileData = {};
let sessionToken = '';

function showToast(msg, type='success') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  const color = type === 'success' ? 'bg-forest-primary text-earth-dark' : 'bg-red-500 text-white';
  toast.className = `px-4 py-3 rounded shadow-lg font-medium transition-all transform duration-300 translate-x-full ${color}`;
  toast.innerText = msg;
  container.appendChild(toast);
  
  // slide in
  requestAnimationFrame(() => {
    toast.classList.remove('translate-x-full');
  });
  
  setTimeout(() => {
    toast.classList.add('translate-x-full');
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

function showTab(id, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
  document.getElementById('tab-' + id).classList.remove('hidden');
  
  document.querySelectorAll('.tab-btn').forEach(el => {
    el.classList.remove('border-forest-primary', 'text-forest-primary');
    el.classList.add('border-transparent', 'text-gray-400');
  });
  btn.classList.remove('border-transparent', 'text-gray-400');
  btn.classList.add('border-forest-primary', 'text-forest-primary');
}

function handleGoogleLogin(response) {
  fetch(API + '/api/auth/google', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({credential: response.credential})
  }).then(r => {
    if (!r.ok) throw new Error('Unauthorized');
    return r.json();
  }).then(data => {
    sessionToken = data.token;
    document.getElementById('auth-section').innerHTML = `<span class="text-sm">Logado como <b class="text-amber-accent">${data.email}</b></span>`;
    document.getElementById('app-content').classList.remove('hidden');
    loadData();
    loadImages();
  }).catch(err => {
    showToast('Acesso negado', 'error');
  });
}

function authHeaders() {
  return { 'Authorization': 'Bearer ' + sessionToken, 'Content-Type': 'application/json' };
}

async function loadData() {
  const r = await fetch(API + '/api/profile');
  profileData = await r.json();
  
  // Perfil
  document.getElementById('f-name').value = profileData.profile?.name || '';
  document.getElementById('f-role').value = profileData.profile?.role || '';
  document.getElementById('f-status').value = profileData.profile?.status || '';
  document.getElementById('f-bio').value = profileData.profile?.bio || '';
  document.getElementById('f-quote').value = profileData.personal_space?.quote?.text || '';
  document.getElementById('f-quote-author').value = profileData.personal_space?.quote?.author || '';
  
  // Redes
  document.getElementById('s-github').value = profileData.profile?.socials?.github || '';
  document.getElementById('s-linkedin').value = profileData.profile?.socials?.linkedin || '';
  document.getElementById('s-email').value = profileData.profile?.socials?.email || '';
  document.getElementById('s-pgp').value = profileData.profile?.socials?.pgp || '';

  renderHobbies();
}

function renderHobbies() {
  const wrapper = document.getElementById('hobbies-wrapper');
  wrapper.innerHTML = '';
  const hobbies = profileData.personal_space?.hobbies || [];
  
  hobbies.forEach((hobby, hIndex) => {
    const box = document.createElement('div');
    box.className = "p-4 bg-earth-bg rounded border border-earth-border space-y-3 shadow-inner";
    box.innerHTML = `
      <div class="flex justify-between items-center">
        <input class="bg-earth-dark border border-earth-border p-1 rounded text-sm font-bold text-amber-accent outline-none focus:border-amber-accent" value="${hobby.name}" onchange="updateHobby(${hIndex}, 'name', this.value)">
        <button onclick="removeHobby(${hIndex})" class="text-red-500 hover:text-red-400 text-xs font-bold">Excluir</button>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div><label class="text-xs text-gray-500">Slug da URL</label><input class="w-full bg-earth-dark border border-earth-border p-1 rounded text-xs outline-none focus:border-forest-primary" value="${hobby.slug}" onchange="updateHobby(${hIndex}, 'slug', this.value)"></div>
        <div><label class="text-xs text-gray-500">Ícone (React Icon)</label><input class="w-full bg-earth-dark border border-earth-border p-1 rounded text-xs outline-none focus:border-forest-primary" value="${hobby.icon}" onchange="updateHobby(${hIndex}, 'icon', this.value)"></div>
      </div>
      <div class="mt-4 border-t border-earth-border pt-2 space-y-2" id="topics-${hIndex}"></div>
      <button onclick="addTopic(${hIndex})" class="text-xs text-forest-primary mt-2 flex items-center gap-1"><span class="text-lg">+</span> Adicionar Tópico (Livro, Tech, etc)</button>
    `;
    wrapper.appendChild(box);
    
    // Render topics
    const topicsWrapper = document.getElementById(`topics-${hIndex}`);
    (hobby.topics || []).forEach((topic, tIndex) => {
      const tBox = document.createElement('div');
      tBox.className = "flex gap-2 items-start bg-earth-dark p-2 rounded";
      tBox.innerHTML = `
        <div class="flex-1 space-y-1">
          <input class="w-full bg-transparent border-b border-earth-border text-xs outline-none focus:border-forest-primary text-gray-200 placeholder:text-gray-600 pb-1" placeholder="Título do Tópico" value="${topic.title || ''}" onchange="updateTopic(${hIndex}, ${tIndex}, 'title', this.value)">
          <input class="w-full bg-transparent border-b border-transparent text-xs outline-none focus:border-forest-primary text-gray-400 placeholder:text-gray-600" placeholder="Descrição ou link..." value="${topic.description || ''}" onchange="updateTopic(${hIndex}, ${tIndex}, 'description', this.value)">
        </div>
        <button onclick="removeTopic(${hIndex}, ${tIndex})" class="text-red-500 hover:bg-red-500/20 px-2 py-1 rounded text-xs">X</button>
      `;
      topicsWrapper.appendChild(tBox);
    });
  });
}

// State mutators
function addHobby() {
  if (!profileData.personal_space.hobbies) profileData.personal_space.hobbies = [];
  profileData.personal_space.hobbies.push({name: "Novo Universo", slug: "novo", icon: "FaCube", topics: []});
  renderHobbies();
}
function removeHobby(hIdx) { profileData.personal_space.hobbies.splice(hIdx, 1); renderHobbies(); }
function updateHobby(hIdx, field, val) { profileData.personal_space.hobbies[hIdx][field] = val; }

function addTopic(hIdx) {
  if (!profileData.personal_space.hobbies[hIdx].topics) profileData.personal_space.hobbies[hIdx].topics = [];
  profileData.personal_space.hobbies[hIdx].topics.push({title: "", description: ""});
  renderHobbies();
}
function removeTopic(hIdx, tIdx) { profileData.personal_space.hobbies[hIdx].topics.splice(tIdx, 1); renderHobbies(); }
function updateTopic(hIdx, tIdx, field, val) { profileData.personal_space.hobbies[hIdx].topics[tIdx][field] = val; }

async function saveProfile() {
  // Sync basic fields
  if(!profileData.profile) profileData.profile = {};
  profileData.profile.name = document.getElementById('f-name').value;
  profileData.profile.role = document.getElementById('f-role').value;
  profileData.profile.status = document.getElementById('f-status').value;
  profileData.profile.bio = document.getElementById('f-bio').value;
  
  if(!profileData.profile.socials) profileData.profile.socials = {};
  profileData.profile.socials.github = document.getElementById('s-github').value;
  profileData.profile.socials.linkedin = document.getElementById('s-linkedin').value;
  profileData.profile.socials.email = document.getElementById('s-email').value;
  profileData.profile.socials.pgp = document.getElementById('s-pgp').value;

  if(!profileData.personal_space) profileData.personal_space = {};
  profileData.personal_space.quote = {
    text: document.getElementById('f-quote').value,
    author: document.getElementById('f-quote-author').value
  };

  try {
    showToast('Salvando...', 'success');
    const r = await fetch(API + '/api/profile', { method: 'PUT', headers: authHeaders(), body: JSON.stringify(profileData) });
    if (r.ok) {
      showToast('✓ Alterações salvas com sucesso!');
      // Force iframe refresh (bypass cache)
      const iframe = document.getElementById('preview-frame');
      iframe.src = iframe.src.split('?')[0] + '?t=' + new Date().getTime();
    } else throw new Error();
  } catch (e) { showToast('Erro ao salvar', 'error'); }
}

async function uploadCV(file) {
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  try {
    showToast('Enviando Currículo...', 'success');
    const res = await fetch(API + '/api/upload-cv', {method: 'POST', headers: {'Authorization': 'Bearer ' + sessionToken}, body: fd});
    const data = await res.json();
    if(data.status === 'ok') showToast('✓ Currículo enviado para ' + data.storage.toUpperCase());
    else throw new Error();
  } catch (e) { showToast('Erro no CV', 'error'); }
}

async function uploadFiles(files) {
  if (!files.length) return;
  showToast('Enviando imagens...', 'success');
  let hasError = false;
  for (let f of files) {
    const fd = new FormData(); fd.append('file', f);
    try {
      const res = await fetch(API + '/api/upload-image', {method: 'POST', headers: {'Authorization': 'Bearer ' + sessionToken}, body: fd});
      if (!res.ok) {
        console.error(await res.text());
        hasError = true;
      }
    } catch (e) {
      hasError = true;
    }
  }
  if (hasError) showToast('Erro no envio. Verifique o log (F12).', 'error');
  else showToast('✓ Imagens enviadas!');
  loadImages();
}

async function loadImages() {
  const r = await fetch(API + '/api/images', { headers: authHeaders() });
  const imgs = await r.json();
  const grid = document.getElementById('img-grid');
  grid.innerHTML = '';
  imgs.forEach(name => {
    const div = document.createElement('div');
    div.className = "relative group aspect-square rounded overflow-hidden border border-earth-border bg-earth-dark flex items-center justify-center";
    div.innerHTML = `
      <img src="{{FRONTEND_URL}}/images/${name}" class="w-full h-full object-cover">
      <div class="absolute inset-0 bg-black/70 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-all">
        <button onclick="deleteImage('${name}')" class="text-white bg-red-600 hover:bg-red-500 px-3 py-1.5 rounded text-xs font-bold shadow-lg transform translate-y-2 group-hover:translate-y-0 transition-all">Excluir</button>
      </div>
    `;
    grid.appendChild(div);
  });
}

async function deleteImage(name) {
  if(!confirm('Tem certeza que deseja deletar ' + name + '?')) return;
  await fetch(API + '/api/images/' + name, {method: 'DELETE', headers: authHeaders()});
  showToast('Imagem excluída');
  loadImages();
}
</script>
</body>
</html>
